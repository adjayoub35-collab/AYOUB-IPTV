name: Build AYOUB IPTV APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unpack project
        run: unzip -q AYOUB_IPTV_Android_Project.zip -d project

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk AYOUB-IPTV.apk

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          gh release create "v$VERSION" AYOUB-IPTV.apk \
            --title "AYOUB IPTV $VERSION" \
            --notes "AYOUB IPTV Android APK"
